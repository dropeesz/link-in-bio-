  <style>
    :root {
      --dark: #1F3D36;
      --dark2: #16302A;
      --green: #3F7D5B;
      --must: #D98E1F;
      --berry: #A83A66;
      --paper: #EEF3EC;
      --mint: #BFD9CC;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--white);
      background: var(--dark2);
      background-image:
        radial-gradient(ellipse 120% 60% at 50% -10%, rgba(63, 125, 91, .55), transparent 70%),
        linear-gradient(180deg, var(--dark) 0%, var(--dark2) 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: max(32px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    }

    main {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center
    }

    .avatar {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 3px solid var(--must);
      padding: 4px;
      margin-bottom: 18px;
      background: var(--dark);
    }

    .avatar-in {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--green);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 48px;
      color: var(--white);
    }

    .avatar-in img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.2
    }

    .role {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 500;
      color: var(--mint)
    }

    .handle {
      margin-top: 2px;
      font-size: 14px;
      color: var(--mint);
      opacity: .8
    }

    .tagline {
      margin-top: 16px;
      max-width: 34ch;
      font-size: 15px;
      line-height: 1.55;
      color: var(--paper)
    }

    nav {
      width: 100%;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 14px 18px;
      border-radius: 18px;
      text-decoration: none;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .18);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .14);
      border-color: rgba(255, 255, 255, .32)
    }

    .btn:active {
      transform: translateY(0)
    }

    .btn:focus-visible {
      outline: 3px solid var(--must);
      outline-offset: 3px
    }

    .btn svg.ic {
      flex: none;
      width: 26px;
      height: 26px
    }

    .btn .txt {
      flex: 1;
      display: flex;
      flex-direction: column;
      line-height: 1.3
    }

    .btn small {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--mint);
      margin-top: 1px
    }

    .btn svg.go {
      flex: none;
      width: 18px;
      height: 18px;
      opacity: .7
    }

    .btn.primary {
      background: var(--berry);
      border-color: transparent;
      min-height: 72px;
      font-size: 17px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .25)
    }

    .btn.primary:hover {
      background: #B94476
    }

    .btn.primary small {
      color: rgba(255, 255, 255, .85)
    }

    footer {
      margin-top: 32px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--mint);
      opacity: .85
    }

    @media (prefers-reduced-motion:no-preference) {

      .avatar,
      h1,
      .role,
      .handle,
      .tagline,
      .btn,
      footer {
        animation: up .6s ease both
      }

      h1 {
        animation-delay: .05s
      }

      .role {
        animation-delay: .1s
      }

      .handle {
        animation-delay: .12s
      }

      .tagline {
        animation-delay: .16s
      }

      .btn:nth-child(1) {
        animation-delay: .2s
      }

      .btn:nth-child(2) {
        animation-delay: .27s
      }

      .btn:nth-child(3) {
        animation-delay: .34s
      }

      .btn:nth-child(4) {
        animation-delay: .41s
      }

      footer {
        animation-delay: .5s
      }

      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(14px)
        }

        to {
          opacity: 1;
          transform: none
        }
      }
    }
  </style>
</head>
